# Project-wide Gradle settings.
# Multi-module + KSP + Compose: 2GB is easily stretched to the limit.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# After setting up multi-module builds, you can enable the build cache for parallel builds.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration Cache: if nothing has changed, skip the configuration phase.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official