name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  # No paths-ignore on pull requests: if this check becomes required in branch protection,
  # a skipped run would leave docs-only PRs waiting forever for a check that never reports.
  pull_request:
    branches:
      - main

# CI only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests & debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      # The Gradle daemon runs on JDK 21 (gradle/gradle-daemon-jvm.properties).
      # JDK 17 for the pure JVM modules is preinstalled on the runner and detected by Gradle;
      # the Foojay resolver downloads it if it is ever missing.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle downloads and validates the Gradle wrapper JAR checksum.
      # Pinned to v5: v6 adds a separately licensed caching component.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Show versions
        run: ./gradlew --version

      # The Kotlin 2.2 compiler reads library metadata only up to 2.3.
      # Fail early with a clear message instead of hundreds of compiler errors.
      - name: Check kotlin-stdlib version
        run: |
          ./gradlew -q :app:dependencies --configuration debugCompileClasspath > app-dependencies.txt
          pattern='org\.jetbrains\.kotlin:kotlin-stdlib[^ ]*:(\{strictly [^}]+\} |[^ ]+ )?(-> )?(2\.([4-9]|[1-9][0-9])|[3-9]\.[0-9]+)\.[0-9]+'
          if grep -E "$pattern" app-dependencies.txt; then
            echo "::error::A dependency pulls kotlin-stdlib 2.4 or newer, which the Kotlin 2.2 compiler cannot read. See Architecture Decisions in README.md."
            exit 1
          fi
          echo "kotlin-stdlib stays below 2.4."

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7